{% set name = "xscen" %}
{% set version = "0.16.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/xscen-{{ version }}.tar.gz
  sha256: a3ba82bb43567767441849f657a9a036b3ff10a85f3c7e9df3fb63aa63b57b37

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=4.0,<5.0
    - pip
  run:
    - python >={{ python_min }}
    # Main package
    - boltons >=20.1
    - cartopy >=0.23.0
    - cftime
    - cf_xarray >=0.7.6
    - clisops >=0.16.1
    - dask-core >=2024.8.1
    - flox
    - fsspec
    - geopandas >=1.0
    - h5netcdf
    - h5py
    - intake-esm ==2025.2.3
    - matplotlib-base >=3.6
    - nc-time-axis >=1.3.1
    - netcdf4
    - numcodecs <0.16.0
    - numpy >=2.0
    - openpyxl
    - pandas >=2.3.0
    - parse
    - pyarrow >=15.0.0
    - pydantic >=2.8.2
    - pyproj
    - pyyaml
    - rechunker >=0.5.3
    - scipy >=1.11.0
    - shapely >=2.0
    - sparse
    - toolz
    - xarray >=2024.11.0
    - xclim >=1.0.0
    - xesmf >=0.7,!=0.8.8
    - xsdba >=0.8.0
    - zarr >=2.13,<3.0
    - fastprogress <1.1  # FIXME: Temporary fix for https://github.com/AnswerDotAI/fastprogress/issues/117 (fastprogress is a dep through intake-esm)

test:
  imports:
    - xscen
  source_files:
    - CHANGELOG.rst
    - docs
    - templates
    - tests
    - src/xscen
  commands:
    - pip check
    - pytest tests -m "not requires_netcdf"
  requires:
    - python {{ python_min }}
    - pip
    - pytest

about:
  home: https://github.com/Ouranosinc/xscen
  summary: A climate change scenario-building analysis framework, built with xclim/xarray.
  description: |
    A climate change scenario-building analysis framework, built with Intake-esm catalogs
    and xarray-based packages such as xclim and xESMF.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://xscen.readthedocs.io
  dev_url: https://github.com/Ouranosinc/xscen

extra:
  recipe-maintainers:
    - aulemahal
    - juliettelavoie
    - RondeauG
    - Zeitsperre
